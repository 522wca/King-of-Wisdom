<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>智慧闖關王</title>
<style>
:root{--bg:#fdf6e9;--card:#fff;--tx:#2b2540;--mu:#7a7390;--ac:#6c4cf1;--ok:#1faa6b;--no:#e5484d;--bd:#e8dfcf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17142a;--card:#241f40;--tx:#f1eefc;--mu:#a49dc4;--ac:#9a82ff;--bd:#3a3360}}
:root[data-theme="dark"]{--bg:#17142a;--card:#241f40;--tx:#f1eefc;--mu:#a49dc4;--ac:#9a82ff;--bd:#3a3360}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}
#app{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{margin:8px 0 0;font-size:28px}h2{margin:4px 0 12px}
.mu{color:var(--mu);margin:4px 0 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font:inherit;color:inherit;cursor:pointer}
.cat{background:var(--card);border:2px solid var(--bd);border-top:6px solid var(--c);border-radius:16px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.cat .em{font-size:38px}.cat b{font-size:18px}.cat small{color:var(--mu)}
.lv,.opt,.btn{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:14px 16px;margin:10px 0}
.lv:disabled{opacity:.45;cursor:not-allowed}
.btn{background:var(--ac);color:#fff;border-color:var(--ac);text-align:center;font-weight:700}
.ghost{background:none;border:none;color:var(--mu);padding:4px 0;font-size:15px}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin:10px 0 18px}
.bar i{display:block;height:100%;background:var(--ac)}
.top{display:flex;justify-content:space-between;align-items:center}
.q{font-size:20px;font-weight:700;margin:6px 0 12px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 18%,var(--card))}
.note{background:var(--card);border:2px dashed var(--ac);border-radius:14px;padding:12px 14px;margin:12px 0}
.center{text-align:center}.big{font-size:56px;margin:10px 0}
</style>
</head>

let S={};try{S=JSON.parse(localStorage.getItem('zhiwang')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('zhiwang',JSON.stringify(S))}catch(e){}};
const $=document.getElementById('app');
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const tot=()=>Object.values(S).reduce((a,b)=>a+b,0);
const MAX=D.reduce((a,c)=>a+c.L.length*3,0);
const rank=()=>{const r=tot()/MAX;return r>=1?'👑 智慧王':r>=.7?'🎓 智慧大師':r>=.4?'📖 博學達人':r>0?'🌱 求知學徒':'🥚 智慧新芽'};
function home(){
$.innerHTML=`<h1>🏆 智慧闖關王</h1><p class="mu">${rank()}・⭐ ${tot()} / ${MAX}</p><div class="grid">${D.map((c,i)=>`<button class="cat" style="--c:${c.c}" onclick="cat(${i})"><span class="em">${c.e}</span><b>${c.n}</b><small>⭐ ${c.L.reduce((a,_,j)=>a+(S[c.id+j]||0),0)} / ${c.L.length*3}</small></button>`).join('')}</div><p class="mu" style="margin-top:20px">每關 3 顆愛心，答對學新知，答錯也有知識小卡！</p>`}
function cat(i){const c=D[i];
$.innerHTML=`<button class="ghost" onclick="home()">← 返回</button><h2>${c.e} ${c.n}</h2>${c.L.map((l,j)=>{const lock=j>0&&!S[c.id+(j-1)];const s=S[c.id+j]||0;return `<button class="lv" ${lock?'disabled':''} onclick="play(${i},${j})"><b>${lock?'🔒':'🚩'} 第 ${j+1} 關：${l.t}</b><br><small class="mu">${'⭐'.repeat(s)+'☆'.repeat(3-s)}${lock?'（先通過上一關）':''}</small></button>`}).join('')}`}
let G;
function play(i,j){G={i,j,qs:sh(D[i].L[j].q),k:0,life:3,wrong:0};ask()}
function ask(){
const q=G.qs[G.k];G.o=sh(q[1].map((t,x)=>[t,x==0]));G.done=false;
$.innerHTML=`<div class="top"><button class="ghost" onclick="cat(${G.i})">✕ 離開</button><span>${'❤️'.repeat(G.life)+'🖤'.repeat(3-G.life)}</span></div><div class="bar"><i style="width:${G.k/G.qs.length*100}%"></i></div><p class="mu">第 ${G.k+1} / ${G.qs.length} 題</p><div class="q">${q[0]}</div>${G.o.map((o,x)=>`<button class="opt" onclick="pick(${x})">${o[0]}</button>`).join('')}<div id="fb"></div>`}
function pick(x){if(G.done)return;G.done=true;
const q=G.qs[G.k],ok=G.o[x][1];
document.querySelectorAll('.opt').forEach((b,n)=>{if(G.o[n][1])b.classList.add('ok');else if(n==x)b.classList.add('no')});
if(!ok){G.life--;G.wrong++}
const last=G.k==G.qs.length-1,over=G.life==0;
document.getElementById('fb').innerHTML=`<div class="note"><b>${ok?'✅ 答對了！':'❌ 再接再厲！'}</b><br>💡 知識小卡：${q[2]}</div><button class="btn" onclick="${over||last?'end()':'G.k++;ask()'}">${over||last?'看結果':'下一題 →'}</button>`}
function end(){
const win=G.life>0,s=win?3-G.wrong:0,c=D[G.i],key=c.id+G.j;
if(win&&s>(S[key]||0)){S[key]=s;save()}
const more=win&&G.j<c.L.length-1;
$.innerHTML=`<div class="center"><div class="big">${win?'🎉':'💪'}</div><h2>${win?'闖關成功！':'挑戰失敗'}</h2><p style="font-size:28px;margin:6px">${win?'⭐'.repeat(s)+'☆'.repeat(3-s):'愛心用完了'}</p><p class="mu">${win?'目前稱號：'+rank():'複習一下知識小卡，再試一次吧！'}</p></div><button class="btn" onclick="play(${G.i},${G.j})">${win?'重玩本關':'再挑戰一次'}</button>${more?`<button class="btn" onclick="play(${G.i},${G.j+1})">下一關 →</button>`:''}<button class="lv center" onclick="home()">回到主選單</button>`}
home();
</script>
</body>
</html>
